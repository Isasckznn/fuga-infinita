<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070914"><title>FUGA INFINITA — FRATURA</title>
<style>
:root{--cyan:#54f6ff;--pink:#ff3ea5;--violet:#9472ff;--gold:#ffe58a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070914;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding-top:12px;text-shadow:0 2px 12px #000}
.brand{font-size:11px;letter-spacing:.28em;color:#9da9c7;font-weight:800}.score{font-size:26px;font-weight:900;letter-spacing:.04em}.small{font-size:10px;color:#8d9ab8;letter-spacing:.18em;font-weight:800}
.stats{text-align:right}.statnum{font-size:17px;font-weight:900;color:var(--cyan)}
#center{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(88vw,430px);text-align:center;pointer-events:auto}
.logo{font-size:clamp(35px,10vw,62px);font-weight:1000;letter-spacing:-.075em;line-height:.88;text-shadow:0 0 24px #4befff66,0 0 60px #a24cff44}
.logo span{color:var(--cyan)}.tag{margin:15px 0 25px;color:#b3bdd4;font-size:10px;letter-spacing:.3em;font-weight:800}
.panel{background:linear-gradient(135deg,#151a31df,#090d1be8);border:1px solid #7185b455;border-radius:22px;padding:20px;box-shadow:0 20px 80px #0009,inset 0 1px #ffffff12;backdrop-filter:blur(12px)}
h1{font-size:13px;letter-spacing:.2em;margin:0 0 9px;color:#eafaff}
.desc{font-size:12px;line-height:1.6;color:#aab5d0;margin:0 auto 17px;max-width:290px}
button{font:inherit;border:0;color:#061018;font-weight:1000;letter-spacing:.14em;border-radius:14px;background:linear-gradient(100deg,#5af6ff,#9cfff0);padding:16px 24px;width:100%;box-shadow:0 8px 30px #4cecff33;cursor:pointer}
.hint{font-size:9px;letter-spacing:.14em;color:#71809f;margin-top:14px}
#controls{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.ctrl{width:56px;height:56px;border-radius:18px;border:1px solid #a2eaff55;background:#101a2b99;color:#c8faff;display:grid;place-items:center;font-size:21px;pointer-events:auto;backdrop-filter:blur(8px);box-shadow:0 6px 24px #0005}
.ctrlgroup{display:flex;gap:9px}.ctrl small{font-size:8px;letter-spacing:.08em;display:block}
#toast{position:absolute;top:23%;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;letter-spacing:.25em;color:var(--gold);opacity:0;text-shadow:0 0 20px #ffc85c;transition:opacity .2s}
.hidden{display:none!important}
#bar{position:absolute;top:77px;left:16px;right:16px;height:3px;background:#ffffff16;border-radius:9px;overflow:hidden}#bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 12px var(--cyan)}
@media(min-width:700px){#controls{max-width:620px;margin:auto}.panel{padding:26px}}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="ui">
 <div class="top"><div><div class="brand">FUGA INFINITA</div><div class="score" id="score">000000</div><div class="small">DISTÂNCIA</div></div><div class="stats"><div class="statnum" id="frags">◇ 000</div><div class="small">FRAGMENTOS</div></div></div>
 <div id="bar"><i id="barfill"></i></div>
 <div id="toast">FRATURA DETECTADA</div>
 <div id="center"><div class="logo">FUGA<br><span>INFINITA</span></div><div class="tag">A REALIDADE NÃO VAI ESPERAR</div><div class="panel"><h1 id="headline">ATRAVESSE A FRATURA</h1><p class="desc" id="description">O mundo está desmoronando. Desvie, salte e atravesse as fendas para sobreviver o máximo possível.</p><button id="start">INICIAR FUGA</button><div class="hint">DESLIZE PARA OS LADOS • PARA CIMA PARA SALTAR</div></div></div>
 <div id="controls" class="hidden"><div class="ctrlgroup"><div class="ctrl" data-act="left">‹</div><div class="ctrl" data-act="right">›</div></div><div class="ctrlgroup"><div class="ctrl" data-act="phase">◈<small>FASE</small></div><div class="ctrl" data-act="jump">↑<small>SALTO</small></div></div></div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id);
let W=0,H=0,D=1,last=0,raf=0,state='menu',time=0,dist=0,frags=0,speed=0.34,spawn=0,shake=0,phase=0;
let player={lane:0,x:0,y:0,jump:0,vy:0,phase:0,trail:[]};
let objects=[],particles=[],stars=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);player.y=H*.77;stars=Array.from({length:48},()=>({x:Math.random()*W,y:Math.random()*H*.7,z:.3+Math.random()*.7}))}
addEventListener('resize',resize,{passive:true});resize();
function road(){return {top:H*.27,bottom:H*.91,center:W/2,topW:W*.12,botW:W*.88}}
function laneX(l,z){let r=road(),p=clamp(z,0,1);return r.center+(l* (r.topW+(r.botW-r.topW)*p)/3)}
function project(o){let p=clamp(o.z,0,1),r=road();return {x:laneX(o.lane,p),y:r.top+(r.bottom-r.top)*p,w:18+p*48,h:16+p*48,p}}
function burst(x,y,color,n=10){for(let i=0;i<n&&particles.length<100;i++){let a=Math.random()*6.28,s=30+Math.random()*150;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.5,max:.85,color,size:1+Math.random()*3})}}
function spawnObject(){let lane=Math.floor(Math.random()*3)-1,roll=Math.random();let type=roll<.55?'block':roll<.78?'rift':'shard';if(type==='shard')lane=Math.floor(Math.random()*3)-1;objects.push({lane,z:0,type,phase:Math.random()<.5?0:1,hit:false})}
function move(dir){if(state!=='play')return;player.lane=clamp(player.lane+dir,-1,1)}
function jump(){if(state==='play'&&player.jump<=0){player.vy=-620;player.jump=1;burst(player.x,player.y,'#5af6ff',5)}}
function switchPhase(){if(state==='play'){phase=1-phase;player.phase=phase;toast('MUDANÇA DE FASE');}}
function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.opacity=0,650)}
function action(a){if(a==='left')move(-1);if(a==='right')move(1);if(a==='jump')jump();if(a==='phase')switchPhase()}
document.querySelectorAll('[data-act]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();action(b.dataset.act)})});
let sx=0,sy=0;canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});canvas.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();else switchPhase()});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key===' ')jump();if(e.key==='ArrowDown'||e.key==='Shift')switchPhase()});
function start(){objects=[];particles=[];dist=0;frags=0;speed=.34;spawn=.4;phase=0;player.lane=0;player.jump=0;player.vy=0;state='play';$('center').classList.add('hidden');$('controls').classList.remove('hidden');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
$('start').onclick=start;
function gameOver(){state='over';$('controls').classList.add('hidden');$('headline').textContent='A FRATURA TE ALCANÇOU';$('description').textContent=`Você percorreu ${Math.floor(dist)} metros e reuniu ${frags} fragmentos. A realidade ainda está lá fora.`;$('start').textContent='TENTAR NOVAMENTE';$('center').classList.remove('hidden');burst(player.x,player.y,'#ff3ea5',28)}
function drawBackground(dt){
 ctx.fillStyle='#070914';ctx.fillRect(0,0,W,H);
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#10152b');g.addColorStop(.55,'#10152a');g.addColorStop(1,'#050711');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 let pulse=.5+.5*Math.sin(time*1.2);let glow=ctx.createRadialGradient(W*.5,H*.34,5,W*.5,H*.34,H*.55);glow.addColorStop(0,`rgba(48,120,180,${.16+pulse*.08})`);glow.addColorStop(1,'rgba(8,10,25,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H*.8);
 for(let s of stars){s.y+=dt*(8+s.z*18);if(s.y>H*.72){s.y=0;s.x=Math.random()*W}ctx.fillStyle=`rgba(160,220,255,${.15+s.z*.45})`;ctx.fillRect(s.x,s.y,1+s.z,1+s.z)}
 // distant broken monoliths
 for(let i=0;i<9;i++){let x=(i*137+time*9)%(W+100)-50,base=H*.46;ctx.save();ctx.translate(x,base);ctx.rotate(Math.sin(i*7+time*.2)*.08);ctx.fillStyle=i%2?'#18233c':'#211b3a';ctx.fillRect(-12-i%3*5,-60-i%4*15,24+i%3*10,65+i%4*15);ctx.fillStyle='#56eaff33';ctx.fillRect(-10,-58-i%4*15,2,50);ctx.restore()}
}
function drawRoad(){
 let r=road(),c=r.center,tw=r.topW,bw=r.botW;
 ctx.beginPath();ctx.moveTo(c-tw/2,r.top);ctx.lineTo(c+tw/2,r.top);ctx.lineTo(c+bw/2,r.bottom);ctx.lineTo(c-bw/2,r.bottom);ctx.closePath();
 let grad=ctx.createLinearGradient(0,r.top,0,r.bottom);grad.addColorStop(0,'#111a31');grad.addColorStop(1,'#0b1020');ctx.fillStyle=grad;ctx.fill();
 ctx.strokeStyle='#5cefff88';ctx.lineWidth=1.5;ctx.shadowBlur=13;ctx.shadowColor='#40dfff';ctx.stroke();ctx.shadowBlur=0;
 for(let k=-1;k<=1;k+=2){ctx.beginPath();ctx.moveTo(c+k*tw/6,r.top);ctx.lineTo(c+k*bw/6,r.bottom);ctx.strokeStyle='#9c83ff38';ctx.setLineDash([8,12]);ctx.stroke();ctx.setLineDash([])}
 // transverse speed marks
 for(let i=0;i<9;i++){let z=((i/9+time*speed*.55)%1),y=r.top+(r.bottom-r.top)*z,w=tw+(bw-tw)*z;ctx.strokeStyle=`rgba(100,220,255,${.03+z*.13})`;ctx.beginPath();ctx.moveTo(c-w/2,y);ctx.lineTo(c+w/2,y);ctx.stroke()}
}
function drawObject(o){let p=project(o),x=p.x,y=p.y,scale=.35+p.p*.9;
 if(o.type==='shard'){ctx.save();ctx.translate(x,y);ctx.rotate(time*1.5);ctx.shadowBlur=18;ctx.shadowColor='#ffe58a';ctx.fillStyle='#fff0a6';ctx.beginPath();ctx.moveTo(0,-p.h*.48);ctx.lineTo(p.w*.28,0);ctx.lineTo(0,p.h*.48);ctx.lineTo(-p.w*.28,0);ctx.closePath();ctx.fill();ctx.restore();return}
 if(o.type==='rift'){ctx.save();ctx.translate(x,y);ctx.scale(1,1.2);ctx.shadowBlur=24;ctx.shadowColor=o.phase?'#ff3ea5':'#54f6ff';ctx.strokeStyle=o.phase?'#ff4fae':'#54f6ff';ctx.lineWidth=3*scale;ctx.beginPath();ctx.ellipse(0,0,p.w*.42,p.h*.5,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ffffffaa';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,p.w*.22,p.h*.32,0,0,Math.PI*2);ctx.stroke();ctx.restore();return}
 ctx.save();ctx.translate(x,y);ctx.shadowBlur=20;ctx.shadowColor='#ff3ea5';let w=p.w*.8,h=p.h*.78;let gr=ctx.createLinearGradient(-w/2,-h/2,w/2,h/2);gr.addColorStop(0,'#ff5fae');gr.addColorStop(1,'#522b70');ctx.fillStyle=gr;ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeStyle='#ffc3e6';ctx.lineWidth=1.2;ctx.strokeRect(-w/2,-h/2,w,h);ctx.fillStyle='#210f2b';ctx.fillRect(-w*.28,-h*.22,w*.56,h*.12);ctx.restore()
}
function drawPlayer(dt){
 let target=laneX(player.lane,1),x=player.x+(target-player.x)*Math.min(1,dt*13),base=H*.77-player.jump;player.x=x;player.y=base;
 let bob=Math.sin(time*12)*2,scale=clamp(H/760,.75,1.15);
 // ground glow
 ctx.save();ctx.globalAlpha=.55;let rg=ctx.createRadialGradient(x,base+19,2,x,base+19,42);rg.addColorStop(0,phase?'#ff3ea577':'#54f6ff77');rg.addColorStop(1,'transparent');ctx.fillStyle=rg;ctx.beginPath();ctx.ellipse(x,base+19,42,13,0,0,Math.PI*2);ctx.fill();ctx.restore();
 // character silhouette with luminous jacket
 ctx.save();ctx.translate(x,base+bob);ctx.scale(scale,scale);
 ctx.shadowBlur=18;ctx.shadowColor=phase?'#ff3ea5':'#54f6ff';
 // legs
 ctx.strokeStyle='#d8faff';ctx.lineWidth=7;ctx.lineCap='round';let run=Math.sin(time*15)*5;
 ctx.beginPath();ctx.moveTo(-6,4);ctx.lineTo(-10+run,22);ctx.moveTo(6,4);ctx.lineTo(10-run,22);ctx.stroke();
 // torso
 let body=ctx.createLinearGradient(-12,-18,12,10);body.addColorStop(0,phase?'#ff76bb':'#7dfaff');body.addColorStop(1,'#5d64bd');ctx.fillStyle=body;ctx.beginPath();ctx.moveTo(-11,-22);ctx.lineTo(11,-22);ctx.lineTo(9,6);ctx.lineTo(-9,6);ctx.closePath();ctx.fill();
 // head / visor
 ctx.fillStyle='#10182d';ctx.beginPath();ctx.arc(0,-31,9,0,Math.PI*2);ctx.fill();ctx.fillStyle=phase?'#ff8cc8':'#aaffff';ctx.fillRect(-7,-34,14,4);
 // energy scarf
 ctx.strokeStyle=phase?'#ff4fae':'#54f6ff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-7,-16);ctx.quadraticCurveTo(-23,-21-run,-30,-12-run);ctx.stroke();
 ctx.restore();
}
function update(dt){
 time+=dt;dist+=dt*speed*95;speed=Math.min(.72,.34+dist/8500);spawn-=dt;
 if(spawn<=0){spawnObject();spawn=Math.max(.48,1.15-(speed-.34)*1.5)+Math.random()*.28}
 player.vy+=1500*dt;if(player.jump>0){player.jump=Math.max(0,player.jump+player.vy*dt);if(player.jump===0)player.vy=0}
 for(let o of objects){o.z+=dt*speed;if(o.z>.82&&!o.hit){let same=o.lane===player.lane;if(o.type==='shard'&&same){o.hit=true;frags++;burst(project(o).x,project(o).y,'#ffe58a',9)}else if(o.type!=='shard'&&same&&player.jump<45&&!(o.type==='rift'&&phase===o.phase)){o.hit=true;gameOver()}}}
 objects=objects.filter(o=>o.z<1.08&&!o.hit);
 for(let p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy=p.vy*.97+30*dt}particles=particles.filter(p=>p.life>0);
 shake=Math.max(0,shake-dt*2);
}
function render(dt){
 ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake*7,(Math.random()-.5)*shake*7);
 drawBackground(dt);drawRoad();
 objects.slice().sort((a,b)=>a.z-b.z).forEach(drawObject);
 drawPlayer(dt);
 for(let p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;
 ctx.restore();
 $('score').textContent=String(Math.floor(dist)).padStart(6,'0');$('frags').textContent='◇ '+String(frags).padStart(3,'0');$('barfill').style.width=(dist%1000)/10+'%';
}
function loop(now){if(state!=='play')return;let dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);render(dt);if(state==='play')raf=requestAnimationFrame(loop)}
// menu background animation at a restrained frame rate
function idle(now){if(state==='play')return;let dt=Math.min(.04,(now-last)/1000||0);last=now;time+=dt;drawBackground(dt);drawRoad();drawPlayer(dt);requestAnimationFrame(idle)}
last=performance.now();requestAnimationFrame(idle);
})();
</script></body></html>
