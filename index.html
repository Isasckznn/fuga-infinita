<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050714"><title>FUGA INFINITA // FRACTURE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050714;color:#eaf7ff;font-family:Inter,system-ui,Arial;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) 16px 16px}
.top{display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:11px;letter-spacing:.28em;color:#7eeeff;font-weight:900;text-shadow:0 0 15px #00d9ff}.score{font-size:28px;font-weight:900;text-align:right;text-shadow:0 0 18px #00cfff}.small{font-size:9px;letter-spacing:.18em;color:#8ba8c9;text-align:right}
#meter{position:absolute;top:72px;left:16px;width:120px;height:4px;background:#18243b;border-radius:9px;overflow:hidden}#fill{height:100%;width:100%;background:linear-gradient(90deg,#00eaff,#a34cff);box-shadow:0 0 12px #00eaff}
#sector{position:absolute;top:85px;left:16px;font-size:9px;letter-spacing:.2em;color:#89b8d5}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 55%,#101c37aa,#03050ceF);padding:24px}
.panel{width:min(420px,100%);text-align:center;border:1px solid #3d9ec866;background:linear-gradient(145deg,#101c32eF,#080b19f5);padding:28px 22px;border-radius:22px;box-shadow:0 0 70px #00aaff22,inset 0 0 35px #5424a022}
h1{font-size:clamp(35px,10vw,58px);line-height:.9;margin:0 0 12px;letter-spacing:-.06em;font-weight:1000;text-shadow:0 0 28px #00d9ff88}h1 span{color:#00eaff}.tag{font-size:10px;letter-spacing:.28em;color:#a78bfa;margin-bottom:25px}.desc{font-size:13px;line-height:1.6;color:#b5c6df;margin:0 auto 22px;max-width:310px}
button{pointer-events:auto;border:0;border-radius:12px;padding:15px 24px;color:#03101b;font-weight:1000;letter-spacing:.12em;background:linear-gradient(100deg,#56f4ff,#9e7bff);box-shadow:0 0 25px #00dfff55;min-width:190px;font-size:12px}
.hint{font-size:10px;color:#7891b3;margin-top:18px;letter-spacing:.12em}
#controls{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}
.pad{display:flex;gap:10px}.ctl{pointer-events:auto;width:54px;height:54px;min-width:0;padding:0;border-radius:50%;background:#10243caa;border:1px solid #54dfff88;color:#c8f8ff;font-size:21px;box-shadow:0 0 20px #00dfff22}
#flash{position:fixed;inset:0;pointer-events:none;background:#9dfaff;opacity:0;mix-blend-mode:screen}
@media(hover:hover) and (pointer:fine){#controls{opacity:.45}}
</style></head>
<body>
<canvas id="game"></canvas><div id="flash"></div>
<div id="hud"><div class="top"><div><div class="brand">FUGA INFINITA / FRACTURE</div><div id="meter"><div id="fill"></div></div><div id="sector">SETOR 01 · REALIDADE INSTÁVEL</div></div><div><div class="score" id="score">000000</div><div class="small">DISTÂNCIA</div></div></div></div>
<div id="overlay"><div class="panel"><h1>FUGA<br><span>INFINITA</span></h1><div class="tag">FRACTURE PROTOCOL</div><p class="desc" id="intro">A realidade está colapsando. Desvie, salte, atravesse fendas e sobreviva enquanto o mundo acelera.</p><button id="start">INICIAR CORRIDA</button><div class="hint">DESLIZE ◀ ▶ PARA MUDAR DE PISTA<br>TOQUE PARA SALTAR</div></div></div>
<div id="controls"><div class="pad"><button class="ctl" id="left">‹</button><button class="ctl" id="right">›</button></div><button class="ctl" id="jump">↑</button></div>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
let W,H,dpr, running=false,dead=false,t=0,last=0,dist=0,speed=0.42,lane=1,targetLane=1,jump=0,energy=100,shake=0,score=0,spawn=0,objects=[],particles=[],stars=[],best=+(localStorage.getItem('fractureBest')||0);
const $=id=>document.getElementById(id);
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()}))}
addEventListener('resize',resize);resize();
const horizon=()=>H*.34, floor=()=>H*.92;
function project(x,z,y=0){let p=1/(1+z*.0032);return {x:W/2+x*p,y:horizon()+(floor()-horizon())*p-y*p, s:p}}
function poly(points,fill,stroke=null,lw=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function glow(x,y,r,color){ctx.save();ctx.shadowBlur=r;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,Math.max(1,r*.08),0,Math.PI*2);ctx.fill();ctx.restore()}
function background(dt){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#050817');g.addColorStop(.45,'#101d3a');g.addColorStop(1,'#070914');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // distant fractured planet
 let px=W*.73,py=H*.19,pr=Math.min(W,H)*.13;let rg=ctx.createRadialGradient(px-pr*.3,py-pr*.4,2,px,py,pr);rg.addColorStop(0,'#b5faff');rg.addColorStop(.2,'#5a8eff');rg.addColorStop(.7,'#30236d');rg.addColorStop(1,'#10142b');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.translate(px,py);ctx.rotate(-.25);ctx.strokeStyle='#9dfbff88';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-pr*.8,-pr*.2);ctx.lineTo(-pr*.12,pr*.05);ctx.lineTo(pr*.08,-pr*.5);ctx.lineTo(pr*.3,pr*.2);ctx.lineTo(pr*.8,pr*.38);ctx.stroke();ctx.restore();
 // stars
 for(const s of stars){s.y+=dt*(8+s.z*30);if(s.y>H){s.y=0;s.x=Math.random()*W}ctx.fillStyle=`rgba(170,220,255,${.25+s.z*.7})`;ctx.fillRect(s.x,s.y,1+s.z*1.5,1+s.z*1.5)}
 // skyline
 for(let i=0;i<18;i++){let x=i*W/14-W*.1,hh=H*(.12+((i*37)%9)/65);ctx.fillStyle=i%2?'#0b1730':'#101b39';ctx.fillRect(x,horizon()-hh,W/24,hh);ctx.fillStyle='#36d9ff55';for(let yy=horizon()-hh+8;yy<horizon()-4;yy+=12)ctx.fillRect(x+5,yy,2,3)}
}
function drawTrack(){
 const h=horizon(),f=floor(),cx=W/2,half=Math.min(W*.48,330);
 poly([{x:cx-half*.35,y:h},{x:cx+half*.35,y:h},{x:cx+half,y:f},{x:cx-half,y:f}],'#10182c');
 // glowing edges and lanes
 for(let k=-1;k<=1;k++){let x1=cx+k*half*.35,x2=cx+k*half;ctx.strokeStyle=k===0?'#456b9b66':'#12dfff88';ctx.lineWidth=k===0?1:3;ctx.beginPath();ctx.moveTo(x1,h);ctx.lineTo(x2,f);ctx.stroke()}
 for(let i=0;i<15;i++){let z=((i*120+dist*2.5)%1800),p=project(0,z);ctx.strokeStyle=`rgba(40,205,255,${.06+p.s*.25})`;ctx.lineWidth=1+p.s*2;ctx.beginPath();ctx.moveTo(p.x-half*.35*p.s,p.y);ctx.lineTo(p.x+half*.35*p.s,p.y);ctx.stroke()}
 // speed streaks
 ctx.save();ctx.globalAlpha=.22;for(let i=0;i<22;i++){let x=(i*97+Math.sin(t+i)*18)%W;let y=(i*71+dist*4)%H;ctx.strokeStyle=i%2?'#26dfff':'#a56bff';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-8,y+25+speed*40);ctx.stroke()}ctx.restore();
}
function drawPortal(z){
 const p=project(0,z),w=90*p.s,h=140*p.s;ctx.save();ctx.translate(p.x,p.y-h*.45);ctx.scale(p.s,p.s);ctx.shadowBlur=24;ctx.shadowColor='#8b5dff';ctx.strokeStyle='#70f7ff';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,0,55+Math.sin(t*4)*3,85+Math.cos(t*3)*3,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#a16bff';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,43,72,0,0,Math.PI*2);ctx.stroke();let gr=ctx.createRadialGradient(0,0,4,0,0,58);gr.addColorStop(0,'#b4ffffaa');gr.addColorStop(.45,'#5b43d455');gr.addColorStop(1,'#07162b00');ctx.fillStyle=gr;ctx.beginPath();ctx.ellipse(0,0,48,78,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawObject(o){
 const p=project((o.lane-1)*.66*330,o.z),s=p.s; if(o.type==='portal'){drawPortal(o.z);return}
 ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);ctx.shadowBlur=18;ctx.shadowColor=o.type==='shard'?'#8c6bff':'#ff376e';
 if(o.type==='shard'){ctx.rotate(t*2+o.spin);poly([{x:0,y:-22},{x:13,y:0},{x:0,y:22},{x:-13,y:0}],'#b18aff','#e6d9ff',2);glow(0,0,25,'#9b72ff')}
 else {let w=o.type==='wall'?65:45,h=o.type==='wall'?70:50;poly([{x:-w/2,y:0},{x:-w/2,y:-h},{x:w/2,y:-h},{x:w/2,y:0}],'#40152e','#ff477d',2);ctx.strokeStyle='#ff8ba9';ctx.lineWidth=2;ctx.strokeRect(-w/2+6,-h+7,w-12,h-14);if(o.type==='block')poly([{x:-w/2,y:-h},{x:0,y:-h-13},{x:w/2,y:-h},{x:w/2,y:0},{x:-w/2,y:0}],'#5b1c43','#ff7399',2)}
 ctx.restore();
}
function drawPlayer(){
 let x=W/2+(lane-1)*Math.min(W*.16,105),ground=H*.79-jump*95,run=Math.sin(t*15)*5;
 // shadow
 ctx.fillStyle='#00dfff44';ctx.beginPath();ctx.ellipse(x,H*.81,24+jump*3,7,0,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.translate(x,ground);ctx.shadowBlur=22;ctx.shadowColor='#00eaff';
 // legs
 ctx.strokeStyle='#78f5ff';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-8,-28);ctx.lineTo(-12+run,-5);ctx.lineTo(-18+run,-1);ctx.moveTo(8,-28);ctx.lineTo(12-run,-7);ctx.lineTo(17-run,-1);ctx.stroke();
 // torso armor
 let gr=ctx.createLinearGradient(-18,-70,18,-25);gr.addColorStop(0,'#d8ffff');gr.addColorStop(.3,'#38cbe8');gr.addColorStop(1,'#343b83');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(-13,-66);ctx.lineTo(13,-66);ctx.lineTo(18,-34);ctx.lineTo(0,-24);ctx.lineTo(-18,-34);ctx.closePath();ctx.fill();ctx.strokeStyle='#aaffff';ctx.lineWidth=2;ctx.stroke();
 // head helmet
 ctx.fillStyle='#17284a';ctx.beginPath();ctx.arc(0,-78,13,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#8fffff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#6ffaff';ctx.fillRect(-8,-81,16,4);
 // energy wings
 ctx.globalAlpha=.75;ctx.strokeStyle='#7c5cff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-13,-55);ctx.lineTo(-29,-75+run);ctx.lineTo(-18,-43);ctx.moveTo(13,-55);ctx.lineTo(29,-75-run);ctx.lineTo(18,-43);ctx.stroke();
 ctx.restore();
 // trailing particles
 for(let i=0;i<3;i++){let a=Math.random();particles.push({x:x+(Math.random()-.5)*16,y:ground-25+Math.random()*15,vx:(Math.random()-.5)*.8,vy:1+Math.random()*2,life:.35,color:i%2?'#55eaff':'#9b68ff'})}
}
function burst(x,y,color,n=18){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.7+Math.random()*.4,color})}}
function drawParticles(dt){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*60*dt;p.y+=p.vy*60*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.shadowBlur=10;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill();if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1;ctx.shadowBlur=0}
function spawnObj(){let r=Math.random(),type=r<.15?'portal':r<.42?'shard':r<.7?'block':'wall';objects.push({type,lane:Math.floor(Math.random()*3),z:1250,spin:Math.random()*6})}
function hit(o){return o.z<45&&o.z>0&&o.lane===Math.round(lane)}
function update(dt){
 t+=dt;dist+=speed*dt*60;score=Math.floor(dist);speed=Math.min(1.05,.42+dist/22000);spawn-=dt;if(spawn<=0){spawnObj();spawn=Math.max(.42,1.05-speed*.55)*(0.7+Math.random()*.7)}
 lane+=(targetLane-lane)*Math.min(1,dt*13);jump=Math.max(0,jump-dt*1.6);
 for(let i=objects.length-1;i>=0;i--){let o=objects[i];o.z-=speed*dt*950;if(hit(o)){if(o.type==='shard'){energy=Math.min(100,energy+18);burst(W/2+(lane-1)*100,H*.65,'#a879ff',22);objects.splice(i,1)}else if(o.type==='portal'){energy=Math.min(100,energy+8);objects.splice(i,1);$('sector').textContent='SETOR '+String(1+Math.floor(dist/1800)).padStart(2,'0')+' · DIMENSÃO ALTERADA';flash()}else if(jump<.35){crash();return}else objects.splice(i,1)}else if(o.z< -40)objects.splice(i,1)}
 energy=Math.max(0,energy-dt*(1.4+speed));if(energy<=0){crash();return}
 $('score').textContent=String(score).padStart(6,'0');$('fill').style.width=energy+'%';
}
function flash(){let f=$('flash');f.style.opacity=.8;setTimeout(()=>f.style.opacity=0,90)}
function crash(){dead=true;running=false;shake=18;burst(W/2,H*.7,'#ff497c',35);best=Math.max(best,score);localStorage.setItem('fractureBest',best);$('intro').innerHTML='COLISÃO DIMENSIONAL.<br>Distância: <b>'+score+'</b> · Recorde: <b>'+best+'</b>'; $('start').textContent='TENTAR NOVAMENTE';$('overlay').style.display='grid'}
function draw(dt){if(shake>0){ctx.save();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}
 background(dt);drawTrack();let sorted=[...objects].sort((a,b)=>b.z-a.z);for(const o of sorted)drawObject(o);if(running||dead)drawPlayer();drawParticles(dt);if(shake>0)ctx.restore();
 // vignette
 let v=ctx.createRadialGradient(W/2,H/2,H*.15,W/2,H/2,H*.8);v.addColorStop(.55,'#00000000');v.addColorStop(1,'#02040bcc');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function loop(now){let dt=Math.min(.035,(now-last)/1000||0);last=now;if(running)update(dt);draw(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function start(){objects=[];particles=[];dist=0;score=0;speed=.42;energy=100;lane=targetLane=1;jump=0;spawn=.4;dead=false;running=true;$('overlay').style.display='none';$('sector').textContent='SETOR 01 · REALIDADE INSTÁVEL'}
$('start').addEventListener('click',start);
function move(d){if(!running)return;targetLane=Math.max(0,Math.min(2,targetLane+d))}
function leap(){if(running&&jump===0){jump=1;burst(W/2+(lane-1)*100,H*.72,'#54efff',8)}}
$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('jump').onclick=leap;
let sx=0,sy=0;canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});canvas.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>24)move(dx>0?1:-1);else if(Math.abs(dy)>22&&dy<0)leap();else if(running)leap()});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key===' '||e.key==='ArrowUp')leap()});
})();
</script></body></html>
