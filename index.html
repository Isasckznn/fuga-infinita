<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b18"><title>FUGA INFINITA</title>
<style>
:root{--cyan:#43f5ff;--pink:#ff3fa4;--gold:#ffd45a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b18;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 35%,#030611a8 100%)}
.top{position:fixed;top:env(safe-area-inset-top,10px);left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.pill{background:#071327b8;border:1px solid #43f5ff55;box-shadow:0 0 22px #21d9ff1b,inset 0 0 18px #21d9ff0b;border-radius:14px;padding:8px 12px;backdrop-filter:blur(10px);min-width:82px}
.small{font-size:9px;letter-spacing:2px;color:#8bb9d1;text-transform:uppercase}.value{font-weight:900;font-size:21px;line-height:1.2;font-variant-numeric:tabular-nums}
#coinHud{color:var(--gold)}#scoreHud{color:#fff;text-align:center}#bestHud{color:var(--cyan);text-align:right}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(180deg,#03071440,#0307149c);transition:opacity .2s}
.panel{width:min(440px,100%);text-align:center;padding:28px 22px 24px;border-radius:26px;border:1px solid #4ceeff55;background:linear-gradient(155deg,#101e36eF,#080d1df2 65%);box-shadow:0 0 60px #00cfff22,inset 0 1px #ffffff1a;backdrop-filter:blur(14px)}
.kicker{font-size:10px;letter-spacing:5px;color:var(--cyan);font-weight:800}
h1{font-size:clamp(38px,12vw,58px);line-height:.9;letter-spacing:-2px;margin:13px 0 9px;font-weight:1000;text-shadow:0 0 12px #20eaff,0 0 38px #168dff88}
h1 span{color:var(--pink);text-shadow:0 0 18px #ff3fa4}
.sub{font-size:13px;line-height:1.55;color:#a9c2d6;margin:14px auto 20px;max-width:310px}
button{font:inherit;border:0;color:#06111c;font-weight:950;letter-spacing:1.5px;border-radius:14px;padding:16px 24px;background:linear-gradient(100deg,#54f5ff,#68a9ff);box-shadow:0 7px 26px #19dfff55;width:100%;font-size:14px}
button:active{transform:scale(.98)}.secondary{margin-top:10px;background:#14233b;color:#c6efff;border:1px solid #3be8ff55;box-shadow:none}
.stats{display:flex;justify-content:center;gap:24px;margin:18px 0 4px}.stats strong{display:block;font-size:20px;color:var(--gold)}.stats span{font-size:9px;letter-spacing:2px;color:#86a9c1}
#controls{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.control{pointer-events:auto;width:66px;height:58px;padding:0;border-radius:18px;background:#08172dc9;border:1px solid #56eaff66;color:#baf8ff;box-shadow:0 0 22px #19dfff22;font-size:20px}
#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 91px);width:100%;text-align:center;color:#8db7cb;font-size:10px;letter-spacing:2px;pointer-events:none;text-shadow:0 2px 6px #000}
#toast{position:fixed;top:22%;left:0;right:0;text-align:center;font-weight:900;letter-spacing:2px;color:var(--gold);font-size:14px;opacity:0;pointer-events:none;text-shadow:0 0 14px #ffb000;transition:opacity .2s}
.hidden{display:none!important}
</style></head>
<body>
<canvas id="game"></canvas><div id="vignette"></div>
<div class="top">
 <div class="pill"><div class="small">MOEDAS</div><div class="value" id="coinHud">◆ 0</div></div>
 <div class="pill" id="scoreHud"><div class="small">DISTÂNCIA</div><div class="value" id="score">0</div></div>
 <div class="pill" id="bestHud"><div class="small">RECORDE</div><div class="value" id="best">0</div></div>
</div>
<div id="toast">+ MOEDA</div>
<div id="hint" class="hidden">← → TROCAR PISTA · ↑ PULAR · ↓ DESLIZAR</div>
<div id="controls" class="hidden">
 <button class="control" id="left" aria-label="Esquerda">◀</button>
 <div style="display:flex;gap:10px"><button class="control" id="jump" aria-label="Pular">▲</button><button class="control" id="slide" aria-label="Deslizar">▼</button></div>
 <button class="control" id="right" aria-label="Direita">▶</button>
</div>
<div id="overlay"><div class="panel">
 <div class="kicker">CORRIDA • SOBREVIVA</div><h1>FUGA<br><span>INFINITA</span></h1>
 <p class="sub" id="description">A cidade não dorme. Três pistas, obstáculos imprevisíveis e uma fuga sem fim. Até onde você consegue chegar?</p>
 <div class="stats"><div><strong id="menuBest">0</strong><span>RECORDE</span></div><div><strong id="bank">0</strong><span>MOEDAS</span></div></div>
 <button id="play">INICIAR CORRIDA</button><button class="secondary" id="how">COMO JOGAR</button>
 </div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,mode='menu',last=0,elapsed=0,distance=0,score=0,coins=+(localStorage.fiCoins||0),best=+(localStorage.fiBest||0);
let player={lane:1,x:0,target:1,jump:0,slide:0,vy:0},objects=[],particles=[],stars=[];
let speed=0.42,spawn=0,shake=0,flash=0,toastTimer=0,swipeStart=null;
const lanes=[-1,0,1];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);player.x=laneX(player.lane)}
function laneX(l){return W/2+l*Math.min(W*.23,112)}
function rand(a,b){return a+Math.random()*(b-a)}
function reset(){elapsed=0;distance=0;score=0;speed=.42;spawn=.6;objects=[];particles=[];shake=0;flash=0;player={lane:1,x:laneX(1),target:1,jump:0,slide:0,vy:0};$('score').textContent='0';$('coinHud').textContent='◆ '+coins}
function start(){reset();mode='run';$('overlay').classList.add('hidden');$('controls').classList.remove('hidden');$('hint').classList.remove('hidden');last=performance.now()}
function end(){mode='over';best=Math.max(best,score);localStorage.fiBest=best;localStorage.fiCoins=coins;$('best').textContent=best;$('menuBest').textContent=best;$('bank').textContent=coins;$('description').textContent=`Você percorreu ${score} metros e coletou moedas. A cidade ainda está esperando por você.`;$('play').textContent='CORRER DE NOVO';$('how').textContent='VOLTAR AO MENU';$('overlay').classList.remove('hidden');$('controls').classList.add('hidden');$('hint').classList.add('hidden')}
function move(n){if(mode!=='run')return;player.lane=Math.max(0,Math.min(2,player.lane+n));player.target=player.lane}
function jump(){if(mode==='run'&&player.jump<=0&&player.slide<=0){player.vy=-720;player.jump=1}}
function slide(){if(mode==='run'&&player.jump<=0){player.slide=.62}}
function addObject(type,lane,z){objects.push({type,lane,z,passed:false,phase:rand(0,6)})}
function spawnWave(){let r=Math.random(),lane=Math.floor(rand(0,3));if(r<.46){addObject(Math.random()<.5?'block':'barrier',lane,1.1)}else if(r<.75){let safe=Math.floor(rand(0,3));for(let i=0;i<3;i++)if(i!==safe)addObject('block',i,1.1)}else{for(let i=0;i<5;i++)addObject('coin',lane,1.05+i*.12)}if(Math.random()<.12)addObject('coin',(lane+1)%3,1.35)}
function project(z,lane){let t=1-z;let horizon=H*.22;let y=horizon+Math.pow(Math.max(0,t),1.72)*H*.77;let spread=30+Math.pow(Math.max(0,t),1.1)*Math.min(W*.24,115);let x=W/2+lane*spread;let scale=.12+t*1.15;return{x,y,scale}}
function drawRoad(){let horizon=H*.22;let bottom=H*1.04;let grad=ctx.createLinearGradient(0,horizon,0,bottom);grad.addColorStop(0,'#0c1831');grad.addColorStop(.55,'#101b35');grad.addColorStop(1,'#07101f');ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(W/2-32,horizon);ctx.lineTo(W/2+32,horizon);ctx.lineTo(W*.96,bottom);ctx.lineTo(W*.04,bottom);ctx.closePath();ctx.fill();
 // side skyline
 for(let side of [-1,1]){for(let i=0;i<9;i++){let x=W/2+side*(48+i*32),bh=35+(i*37%90);ctx.fillStyle=i%2?'#0b1830':'#101d39';ctx.fillRect(x-(side<0?30:0),horizon-bh,30,bh);ctx.fillStyle='#39eaff';for(let j=0;j<4;j++)if((i+j)%3===0)ctx.fillRect(x-(side<0?24:0),horizon-bh+8+j*13,3,4)}}
 ctx.strokeStyle='#43eaff';ctx.globalAlpha=.55;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2-32,horizon);ctx.lineTo(W*.04,bottom);ctx.moveTo(W/2+32,horizon);ctx.lineTo(W*.96,bottom);ctx.stroke();ctx.globalAlpha=1;
 for(let laneLine of [-.5,.5]){ctx.strokeStyle='#4aefff';ctx.globalAlpha=.26;ctx.lineWidth=1;ctx.setLineDash([18,18]);let off=(elapsed*speed*95)%36;ctx.lineDashOffset=-off;ctx.beginPath();ctx.moveTo(W/2+laneLine*28,horizon);ctx.lineTo(W/2+laneLine*W*.16,bottom);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1}
 // horizon glow
 let glow=ctx.createRadialGradient(W/2,horizon,1,W/2,horizon,W*.45);glow.addColorStop(0,'#1feaff44');glow.addColorStop(1,'#1feaff00');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H*.55);
}
function drawPlayer(){let x=player.x,y=H*.78-(player.jump>0?Math.sin((1-player.jump)*Math.PI)*H*.18:0),s=Math.min(W,H)/390;let bob=Math.sin(elapsed*13)*2;
 ctx.save();ctx.translate(x,y+bob);if(player.slide>0){ctx.rotate(-.12);ctx.scale(1.25,.55)}
 // shadow
 ctx.fillStyle='#00dfff33';ctx.beginPath();ctx.ellipse(0,24,27,9,0,0,Math.PI*2);ctx.fill();
 // body
 let g=ctx.createLinearGradient(-18,-48,20,30);g.addColorStop(0,'#b5ffff');g.addColorStop(.35,'#31dfff');g.addColorStop(1,'#1761c9');ctx.fillStyle=g;ctx.shadowColor='#21eaff';ctx.shadowBlur=20;
 roundRect(-15,-42,30,59,10);ctx.fill();ctx.shadowBlur=0;
 ctx.fillStyle='#10213d';roundRect(-12,-34,24,17,6);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-8,-28,5,3);ctx.fillRect(3,-28,5,3);
 ctx.fillStyle='#ff3fa4';roundRect(-17,8,12,19,5);ctx.fill();roundRect(5,8,12,19,5);ctx.fill();
 ctx.strokeStyle='#9cffff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-13,-5);ctx.lineTo(-23,7);ctx.moveTo(13,-5);ctx.lineTo(23,7);ctx.stroke();
 ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawObjects(){for(let o of objects){let p=project(o.z,o.lane);if(o.z<0||o.z>1.4)continue;let s=p.scale;ctx.save();ctx.translate(p.x,p.y);if(o.type==='coin'){ctx.rotate(Math.sin(elapsed*8+o.phase)*.25);ctx.shadowColor='#ffd45a';ctx.shadowBlur=20*s;ctx.fillStyle='#ffd45a';ctx.beginPath();ctx.ellipse(0,0,10*s,14*s,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff3b0';ctx.lineWidth=2*s;ctx.stroke();ctx.fillStyle='#9c5a00';ctx.font=`bold ${12*s}px sans-serif`;ctx.textAlign='center';ctx.fillText('◆',0,4*s)}
 else if(o.type==='block'){ctx.shadowColor='#ff3f91';ctx.shadowBlur=18*s;let g=ctx.createLinearGradient(-22*s,-38*s,22*s,0);g.addColorStop(0,'#ff8bc1');g.addColorStop(1,'#a30d65');ctx.fillStyle=g;roundRect(-23*s,-40*s,46*s,43*s,7*s);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffc1df';ctx.lineWidth=2*s;ctx.stroke()}
 else{ctx.shadowColor='#ffb54b';ctx.shadowBlur=16*s;ctx.fillStyle='#ff9b48';roundRect(-27*s,-47*s,54*s,12*s,5*s);ctx.fill();ctx.fillStyle='#5b2631';ctx.fillRect(-23*s,-35*s,5*s,22*s);ctx.fillRect(18*s,-35*s,5*s,22*s)}
 ctx.restore()}}
function burst(x,y,color,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-130,130),vy:rand(-170,40),life:rand(.25,.6),max:.6,color})}
function update(dt){if(mode!=='run')return;elapsed+=dt;distance+=dt*(speed*55);score=Math.floor(distance);$('score').textContent=score;speed=Math.min(.95,.42+elapsed*.0045);spawn-=dt;if(spawn<=0){spawnWave();spawn=rand(.65,1.05)*(1-(speed-.42)*.5)}
 player.x+=(laneX(player.lane)-player.x)*Math.min(1,dt*14);if(player.jump>0){player.vy+=1900*dt;player.jump+=player.vy*dt/(H*.18);if(player.jump>=1){player.jump=0;player.vy=0}}if(player.slide>0)player.slide=Math.max(0,player.slide-dt);
 for(let o of objects){o.z-=dt*speed*.72;if(!o.passed&&o.z<.12&&o.z>-.02){o.passed=true;if(o.type==='coin'){coins++;$('coinHud').textContent='◆ '+coins;localStorage.fiCoins=coins;burst(laneX(o.lane),H*.7,'#ffd45a',7);$('toast').textContent='+ 1 MOEDA';$('toast').style.opacity=1;toastTimer=.45}else if(o.lane===player.lane){let safe=o.type==='barrier'?player.slide>0:player.jump>0;if(!safe){shake=13;flash=.35;burst(player.x,H*.76,'#ff3f91',22);end();return}}}}
 objects=objects.filter(o=>o.z>-.15);for(let p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=360*dt}particles=particles.filter(p=>p.life>0);shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt);toastTimer-=dt;if(toastTimer<=0)$('toast').style.opacity=0;
}
function render(){ctx.save();if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));ctx.fillStyle='#070b18';ctx.fillRect(0,0,W,H);
 let sky=ctx.createLinearGradient(0,0,0,H*.55);sky.addColorStop(0,'#080d22');sky.addColorStop(1,'#152447');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.55);
 for(let i=0;i<50;i++){let x=(i*97.3)%W,y=(i*53.7)% (H*.42);ctx.fillStyle=`rgba(116,226,255,${.2+Math.sin(elapsed+i)*.15})`;ctx.fillRect(x,y,1.5,1.5)}
 drawRoad();drawObjects();drawPlayer();for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 if(flash){ctx.fillStyle=`rgba(255,30,100,${flash*.45})`;ctx.fillRect(0,0,W,H)}ctx.restore();
}
function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop)}
$('play').onclick=()=>{if(mode==='over')start();else start()};
$('how').onclick=()=>{if(mode==='menu'){$('description').textContent='Deslize para os lados para trocar de pista. Toque em PULAR para passar por blocos e em DESLIZAR para passar sob barreiras. Pegue moedas e sobreviva o máximo possível.';$('how').textContent='ENTENDI'}else{$('description').textContent='A cidade não dorme. Três pistas, obstáculos imprevisíveis e uma fuga sem fim.';$('how').textContent='COMO JOGAR'}};
$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('jump').onclick=jump;$('slide').onclick=slide;
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key===' ')jump();if(e.key==='ArrowDown'||e.key==='s')slide();if(e.key==='Enter'&&mode!=='run')start()});
canvas.addEventListener('touchstart',e=>{if(mode!=='run')return;let t=e.changedTouches[0];swipeStart={x:t.clientX,y:t.clientY,time:Date.now()}},{passive:true});
canvas.addEventListener('touchend',e=>{if(!swipeStart||mode!=='run')return;let t=e.changedTouches[0],dx=t.clientX-swipeStart.x,dy=t.clientY-swipeStart.y;if(Math.max(Math.abs(dx),Math.abs(dy))>24){if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();else slide()}swipeStart=null},{passive:true});
window.addEventListener('resize',resize);resize();$('best').textContent=best;$('menuBest').textContent=best;$('bank').textContent=coins;$('coinHud').textContent='◆ '+coins;requestAnimationFrame(loop);
})();
</script></body></html>
