<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070511"><title>FUGA INFINITA — Fratura</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070511;color:#f5f3ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 13px) 15px 15px;display:flex;justify-content:space-between;align-items:flex-start}
.stat{padding:9px 12px;border:1px solid #bba6ff44;border-radius:13px;background:#0c0a1dbb;backdrop-filter:blur(12px);min-width:82px;box-shadow:0 0 28px #8e52ff18}
.label{font-size:9px;letter-spacing:2px;color:#a99bc9}.num{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}
#center{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at center,#0a0820a8,#05040bd9);transition:opacity .3s}
.panel{width:min(440px,100%);padding:30px 23px 23px;border:1px solid #bba6ff55;border-radius:26px;background:linear-gradient(145deg,#17112beF,#080714f5);box-shadow:0 0 90px #743eff22,inset 0 1px #ffffff18;text-align:center;backdrop-filter:blur(18px)}
.kicker{font-size:10px;letter-spacing:5px;color:#c5a8ff;font-weight:800}
h1{font-size:clamp(42px,12vw,64px);line-height:.88;letter-spacing:-3px;margin:15px 0 12px;font-weight:1000;text-shadow:0 0 30px #a66cff88}
h1 em{font-style:normal;color:#66efff}
.desc{font-size:13px;line-height:1.6;color:#b7afcb;margin:0 auto 20px;max-width:320px}
button{border:0;border-radius:14px;padding:16px 20px;width:100%;font:900 13px inherit;letter-spacing:2px;color:#090717;background:linear-gradient(100deg,#d0a6ff,#68eaff);box-shadow:0 8px 30px #9a68ff44}
button:active{transform:scale(.98)}
#help{margin-top:12px;font-size:10px;letter-spacing:1px;color:#a59abf}
#mobile{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.pad{pointer-events:auto;width:68px;height:58px;border:1px solid #c5a8ff66;border-radius:17px;background:#100d24c9;color:#eee4ff;font-size:20px;font-weight:900;box-shadow:0 0 25px #8d5cff22}
#message{position:fixed;top:23%;width:100%;text-align:center;letter-spacing:4px;font-size:11px;color:#8cf5ff;text-shadow:0 0 20px #42eaff;opacity:0;pointer-events:none}
.hide{display:none!important}
</style></head>
<body>
<div id="hud">
 <div class="stat"><div class="label">FRAGMENTOS</div><div class="num" id="fragments">0</div></div>
 <div class="stat" style="text-align:right"><div class="label">DISTÂNCIA</div><div class="num" id="distance">0</div></div>
</div>
<div id="message">A REALIDADE ESTÁ INSTÁVEL</div>
<div id="mobile" class="hide"><button class="pad" id="left">‹</button><div style="display:flex;gap:10px"><button class="pad" id="phase">✧</button><button class="pad" id="jump">↑</button></div><button class="pad" id="right">›</button></div>
<div id="center"><div class="panel">
 <div class="kicker">UMA EXPERIÊNCIA DE SOBREVIVÊNCIA</div>
 <h1>FUGA<br><em>INFINITA</em></h1>
 <p class="desc" id="desc">FRATURA // A realidade perdeu a forma. Atravesse estruturas impossíveis, desvie das anomalias e sobreviva à próxima dobra do universo.</p>
 <button id="start">ENTRAR NA FRATURA</button>
 <div id="help">DESLIZE PARA MOVER · ✧ ALTERA A FASE · ↑ SALTA</div>
 </div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070511);scene.fog=new THREE.FogExp2(0x090617,.021);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,180);camera.position.set(0,4.7,10);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.28;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9f9cff,0x160c29,1.6));
const key=new THREE.DirectionalLight(0xc8b7ff,2.4);key.position.set(-4,9,6);scene.add(key);
const cyan=new THREE.PointLight(0x41eaff,16,30);cyan.position.set(4,3,-8);scene.add(cyan);
const violet=new THREE.PointLight(0xa35aff,20,35);violet.position.set(-5,5,-18);scene.add(violet);
const mat=(color,emissive=color,intensity=.3,rough=.32,metal=.35)=>new THREE.MeshStandardMaterial({color,emissive,emissiveIntensity:intensity,roughness:rough,metalness:metal});
const mats={dark:mat(0x17142b,0x38205c,.5),cyan:mat(0x39dff5,0x26dfff,2,.22,.5),violet:mat(0x8c4eff,0x672cff,2.1,.2,.4),pink:mat(0xff4fae,0xd91b85,1.7),gold:mat(0xffd58a,0xffa928,1.4),white:mat(0xd9faff,0x7deaff,1.1)};
const geo=new THREE.IcosahedronGeometry(.55,1);
const player=new THREE.Group();scene.add(player);
const core=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.85,5,10),mat(0x171e3d,0x5534ad,.9,.25,.5));core.position.y=.8;player.add(core);
const head=new THREE.Mesh(new THREE.SphereGeometry(.29,18,14),mats.white);head.position.y=1.48;player.add(head);
const visor=new THREE.Mesh(new THREE.BoxGeometry(.43,.12,.12),mats.cyan);visor.position.set(0,1.5,.24);player.add(visor);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.55,.045,8,36),mats.violet);ring.position.y=.72;ring.rotation.x=Math.PI/2;player.add(ring);
const trail=new THREE.PointLight(0x8a4fff,3,5);trail.position.set(0,.8,1.3);player.add(trail);
const floorMat=mat(0x0c0a1d,0x21133e,.4,.5,.4);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,190),floorMat);floor.rotation.x=-Math.PI/2;floor.position.set(0,-.08,-72);scene.add(floor);
const grid=new THREE.GridHelper(12,24,0x7647bd,0x33215c);grid.position.set(0,.005,-35);scene.add(grid);
const objects=[],decor=[],particles=[];let running=false,clock=new THREE.Clock(),time=0,distance=0,fragments=0,lane=0,targetX=0,jumpV=0,jumpY=0,phase=0,spawn=0,archSpawn=0,worldSpeed=13,shake=0,phaseFlash=0,lastPhase=0;
const laneX=[-2.25,0,2.25];
function addArchitecture(z){const side=Math.random()<.5?-1:1;let h=THREE.MathUtils.randFloat(3,8),w=THREE.MathUtils.randFloat(1.2,2.8);let g=new THREE.BoxGeometry(w,h,w);let m=Math.random()<.5?mats.dark:mats.violet;let b=new THREE.Mesh(g,m);b.position.set(side*THREE.MathUtils.randFloat(5,9),h/2-0.1,z);b.rotation.set(Math.random()*.3,Math.random(),Math.random()*.18);scene.add(b);decor.push({mesh:b,kind:'arch'})}
function makeObstacle(type,lane,z){let group=new THREE.Group();let x=laneX[lane];if(type==='gate'){let a=new THREE.Mesh(new THREE.BoxGeometry(1.5,2.6,.35),mats.pink);a.position.y=1.25;let b=new THREE.Mesh(new THREE.BoxGeometry(1.9,.18,.5),mats.white);b.position.y=2.65;group.add(a,b)}else if(type==='rift'){let tor=new THREE.Mesh(new THREE.TorusGeometry(.8,.14,12,40),phase%2?mats.cyan:mats.violet);tor.position.y=1.15;group.add(tor);let glow=new THREE.PointLight(0x9c5dff,4,5);glow.position.y=1;group.add(glow)}else{let mesh=new THREE.Mesh(new THREE.OctahedronGeometry(.9,1),mats.dark);mesh.position.y=.9;mesh.rotation.set(.4,.4,.2);group.add(mesh);let edge=new THREE.Mesh(new THREE.EdgesGeometry(new THREE.OctahedronGeometry(.92,1)),mats.cyan);edge.position.copy(mesh.position);group.add(edge)}
group.position.set(x,0,z);scene.add(group);objects.push({group,type,lane,z,hit:false,passed:false})}
function makeFragment(lane,z){let m=new THREE.Mesh(new THREE.OctahedronGeometry(.24,1),mats.gold);m.position.set(laneX[lane],1.2,z);scene.add(m);objects.push({group:m,type:'fragment',lane,z,hit:false,passed:false})}
function wave(){let lane=Math.floor(Math.random()*3);let type=Math.random()<.4?'gate':Math.random()<.5?'rift':'shard';makeObstacle(type,lane,-65);if(Math.random()<.65){let safe=(lane+1+Math.floor(Math.random()*2))%3;for(let i=0;i<3;i++)if(i!==lane&&i!==safe&&Math.random()<.7)makeFragment(i,-76)}else{for(let i=0;i<4;i++)makeFragment(lane,-68-i*2.5)}}
function burst(pos,color){for(let i=0;i<16;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),new THREE.MeshBasicMaterial({color,transparent:true}));m.position.copy(pos);scene.add(m);particles.push({mesh:m,v:new THREE.Vector3((Math.random()-.5)*5,Math.random()*4,(Math.random()-.5)*5),life:.65})}}
function move(d){if(!running)return;lane=Math.max(-1,Math.min(1,lane+d));targetX=laneX[lane+1]}
function jump(){if(running&&jumpY<.05)jumpV=8}
function switchPhase(){if(!running)return;phase=1-phase;phaseFlash=.6;lastPhase=time;$('message').textContent=phase?'FASE ESPECTRAL':'FASE MATERIAL';$('message').style.opacity=1;setTimeout(()=>$('message').style.opacity=0,650);scene.fog.color.setHex(phase?0x130b2b:0x090617);scene.background.setHex(phase?0x100720:0x070511);floorMat.color.setHex(phase?0x20103b:0x0c0a1d);floorMat.emissive.setHex(phase?0x612d9c:0x21133e);cyan.color.setHex(phase?0xff4fae:0x41eaff)}
function reset(){for(let o of objects)scene.remove(o.group);objects.length=0;for(let d of decor)scene.remove(d.mesh);decor.length=0;distance=0;fragments=0;time=0;lane=0;targetX=0;jumpV=0;jumpY=0;phase=0;worldSpeed=13;spawn=1;archSpawn=.2;player.position.set(0,0,0);scene.background.setHex(0x070511);scene.fog.color.setHex(0x090617);floorMat.color.setHex(0x0c0a1d);floorMat.emissive.setHex(0x21133e);cyan.color.setHex(0x41eaff);$('fragments').textContent='0';$('distance').textContent='0'}
function start(){reset();running=true;$('center').classList.add('hide');$('mobile').classList.remove('hide');clock.start()}
function gameOver(){running=false;$('mobile').classList.add('hide');$('desc').textContent=`A fratura venceu desta vez. Você percorreu ${Math.floor(distance)} m e recuperou ${fragments} fragmentos. Tente encontrar outra saída.`;$('start').textContent='TENTAR NOVAMENTE';$('center').classList.remove('hide')}
function update(dt){time+=dt;if(running){worldSpeed=Math.min(25,13+time*.22);distance+=worldSpeed*dt;spawn-=dt;if(spawn<=0){wave();spawn=THREE.MathUtils.randFloat(1.1,1.6)}$('distance').textContent=Math.floor(distance);$('fragments').textContent=fragments;
 player.position.x=THREE.MathUtils.damp(player.position.x,targetX,12,dt);jumpV-=19*dt;jumpY=Math.max(0,jumpY+jumpV*dt);if(jumpY===0)jumpV=0;player.position.y=jumpY;player.rotation.z=THREE.MathUtils.damp(player.rotation.z,(targetX-player.position.x)*-.12,7,dt);player.rotation.y=Math.sin(time*2)*.08;ring.rotation.z+=dt*2.2;player.children[1].position.y=1.48+Math.sin(time*4)*.035;
 for(let o of objects){o.z+=worldSpeed*dt;o.group.position.z=o.z;if(o.type==='fragment')o.group.rotation.y+=dt*2.8;if(o.z>1&&!o.passed){o.passed=true;if(o.type==='fragment'){fragments++;burst(o.group.position,0xffd58a);scene.remove(o.group)}else if(Math.abs(player.position.x-laneX[o.lane])<.9){let avoids=o.type==='gate'?jumpY>1.1:o.type==='rift'?phase===1:jumpY>1.25;if(!avoids){burst(player.position,0xff4fae);gameOver()}}}}
 for(let i=objects.length-1;i>=0;i--)if(objects[i].z>8){scene.remove(objects[i].group);objects.splice(i,1)}
 archSpawn-=dt;if(archSpawn<=0){addArchitecture(-85-Math.random()*35);archSpawn=THREE.MathUtils.randFloat(.35,.75);}
 for(let d of decor){d.mesh.position.z+=worldSpeed*dt*.75}for(let i=decor.length-1;i>=0;i--)if(decor[i].mesh.position.z>12){scene.remove(decor[i].mesh);decor.splice(i,1)}
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.mesh.position.addScaledVector(p.v,dt);p.v.y-=8*dt;p.mesh.material.opacity=Math.max(0,p.life/.65);if(p.life<=0){scene.remove(p.mesh);particles.splice(i,1)}}
 }
 const camX=player.position.x*.34+Math.sin(time*.23)*.55;camera.position.x=THREE.MathUtils.damp(camera.position.x,camX,2.4,dt);camera.position.y=THREE.MathUtils.damp(camera.position.y,4.3+jumpY*.18+Math.sin(time*.7)*.15,2,dt);camera.position.z=THREE.MathUtils.damp(camera.position.z,10.8+Math.sin(time*.38)*.8,2,dt);camera.lookAt(player.position.x*.22,1.1,-7);
 // floating monoliths / rings create impossible spatial scale
 cyan.position.x=4+Math.sin(time*.4)*2;violet.position.z=-18+Math.cos(time*.3)*3;
}
function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.04);update(dt);renderer.render(scene,camera)}
$('start').onclick=start;$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('jump').onclick=jump;$('phase').onclick=switchPhase;
let touch=null;renderer.domElement.addEventListener('touchstart',e=>{let t=e.changedTouches[0];touch={x:t.clientX,y:t.clientY}},{passive:true});renderer.domElement.addEventListener('touchend',e=>{if(!touch||!running)return;let t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;if(Math.abs(dx)>35||Math.abs(dy)>35){if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();else switchPhase()}touch=null},{passive:true});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key===' ')jump();if(e.key==='ArrowDown'||e.key==='Shift')switchPhase()});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.65))});
for(let i=0;i<20;i++)addArchitecture(-i*8-20);loop();
</script></body></html>
